# Utilise le port donné par Render, sinon le port 8082 en local
server.port=${PORT:8082}

# Configuration de la base de données (Dynamique pour Render, repli sur localhost pour ton PC)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/recipe_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect